name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - run: bash -n scripts/setup-github-deploy.sh
      - run: python3 -m unittest discover -s test -p 'test_deploy.py'
